name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      START_URL: ${{ vars.START_URL || 'https://autoprint.freedev.app/s/app.php?src=app' }}
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Install Android SDK components using modern package names
      - uses: android-actions/setup-android@v3
        with:
          api-level: 33
          components: |
            platform-tools
            build-tools;33.0.2
            platforms;android-33
            cmdline-tools;latest

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          if [ -n "$ANDROID_SDK_ROOT" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          else
            echo "sdkmanager not found at $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager — skipping license acceptance"
          fi

      - name: Make Gradle wrapper executable (if present)
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Build APK (debug)
        shell: bash
        run: ./gradlew :app:assembleDebug -PSTART_URL="$START_URL" --no-daemon --stacktrace

      - name: Keystore decode (if secrets provided)
        if: env.KEYSTORE_B64 != ''
        shell: bash
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Signed release APK + Play Store AAB (if secrets provided)
        if: env.KEYSTORE_B64 != ''
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease -PSTART_URL="$START_URL" --no-daemon --stacktrace

      - name: Upload APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: AutoPrint-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
