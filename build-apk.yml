name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      START_URL: ${{ vars.START_URL || 'https://autoprint.freedev.app/s/app.php?src=app' }}
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK (test ke liye, seedha install ho jata hai)
        run: gradle :app:assembleDebug -PSTART_URL="$START_URL" --no-daemon --stacktrace

      - name: Keystore decode (sirf agar secrets daale hain)
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Signed release APK + Play Store AAB (sirf agar secrets daale hain)
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease -PSTART_URL="$START_URL" --no-daemon --stacktrace

      - name: APK download ke liye rakho
        uses: actions/upload-artifact@v4
        with:
          name: AutoPrint-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
