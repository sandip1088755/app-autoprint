plugins {
    id 'com.android.application'
}

def startUrl = (project.findProperty('START_URL') ?: 'https://autoprint.freedev.app/s/app.php?src=app').toString()
def appHost = java.net.URI.create(startUrl).getHost()
def vCode = Integer.parseInt((project.findProperty('VERSION_CODE') ?: '1').toString())
def vName = (project.findProperty('VERSION_NAME') ?: '1.0.0').toString()

android {
    namespace 'app.freedev.autoprint'
    compileSdk 35

    defaultConfig {
        applicationId 'app.freedev.autoprint'
        minSdk 24
        targetSdk 35
        versionCode vCode
        versionName vName
        buildConfigField 'String', 'START_URL', '"' + startUrl + '"'
        manifestPlaceholders = [appHost: appHost]
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    signingConfigs {
        release {
            if (System.getenv('KEYSTORE_FILE')) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
}
